name: Web CI

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    # PostgreSQL runs as a native GitHub Actions service container: it starts
    # before the first step, and its own health check (pg_isready) gates step
    # execution automatically -- no explicit "wait for postgres" step is needed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password_not_for_prod
          POSTGRES_DB: ai_hair_architect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test_user -d ai_hair_architect_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Disposable, job-scoped test credentials only. Never real infrastructure,
      # never production, never a GitHub repository secret (nothing here needs
      # to survive past this single job run).
      TEST_DATABASE_URL: postgresql://ci_test_user:ci_test_password_not_for_prod@localhost:5432/ai_hair_architect_test
      M15_OBJECT_STORAGE_INTEGRATION: isolated
      OBJECT_STORAGE_BACKEND: s3
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_BUCKET_ALIAS: ci-isolated-alias
      OBJECT_STORAGE_BUCKET: ci-privacy-${{ github.run_id }}-${{ github.run_attempt }}
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_SERVER_SIDE_ENCRYPTION: none
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ci_test_localstack_not_for_prod
      AWS_SECRET_ACCESS_KEY: ci_test_localstack_secret_not_for_prod
      LOCALSTACK_CONTAINER_NAME: ci-localstack-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Mask temporary test credentials in logs
        run: |
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"

      - run: npm ci

      # Fast, infrastructure-free checks run first so a lint/type failure fails
      # the job before any container is started.
      - run: npm run lint
      - run: npm run typecheck

      - name: Start pinned LocalStack S3 container
        run: |
          docker run -d \
            --name "$LOCALSTACK_CONTAINER_NAME" \
            -p 127.0.0.1:9000:4566 \
            -e SERVICES=s3 \
            localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a

      - name: Wait for LocalStack readiness (bounded)
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --connect-timeout 2 --max-time 3 \
              "$OBJECT_STORAGE_ENDPOINT/_localstack/health" > /dev/null; then
              echo "LocalStack health endpoint is ready."
              exit 0
            fi
            echo "Waiting for LocalStack health endpoint... ($i/30)"
            sleep 2
          done
          echo "::error::CI storage infrastructure failure: LocalStack health endpoint did not become ready after 30 bounded attempts."
          exit 1

      # Retain the bucket bootstrap; the real S3 suite owns separate buckets.
      # LocalStack Community does not verify bucket-level anonymous denial.
      # Application route auth/owner-scope tests retain privacy coverage.
      - name: Create and verify the test bucket with AWS SDK
        timeout-minutes: 2
        run: |
          node <<'NODE'
          const { S3Client, CreateBucketCommand, HeadBucketCommand } = require("@aws-sdk/client-s3");
          const client = new S3Client({
            region: process.env.OBJECT_STORAGE_REGION,
            endpoint: process.env.OBJECT_STORAGE_ENDPOINT,
            forcePathStyle: true,
            maxAttempts: 1,
            requestHandler: { connectionTimeout: 3000, requestTimeout: 10000 }
          });
          (async () => {
            try {
              const Bucket = process.env.OBJECT_STORAGE_BUCKET;
              await client.send(new CreateBucketCommand({ Bucket }));
              await client.send(new HeadBucketCommand({ Bucket }));
              console.log("Test bucket created and verified.");
            } finally {
              client.destroy();
            }
          })().catch(() => {
            console.error("CI storage fixture failure: AWS SDK bucket bootstrap failed.");
            process.exitCode = 1;
          });
          NODE

      # @prisma/client's own postinstall hook already runs `prisma generate`
      # during `npm ci` above -- no separate generate step is required by the
      # existing workflow.
      - name: Apply Prisma migrations to the test database
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # Re-derives, verbatim, the exact activation conditions already read by
      # tests/integration/*.integration.test.ts (TEST_DATABASE_URL presence;
      # M15_OBJECT_STORAGE_INTEGRATION=isolated + OBJECT_STORAGE_BACKEND=s3 +
      # OBJECT_STORAGE_SERVER_SIDE_ENCRYPTION=none + a non-AWS endpoint). If
      # this check passes, the integration tests below are mathematically
      # guaranteed to run rather than silently self-skip -- no new
      # configuration contract is introduced, only the existing one is
      # verified before relying on it.
      - name: Confirm integration tests cannot silently skip
        run: |
          node -e '
            const dbOk = Boolean(process.env.TEST_DATABASE_URL);
            const endpoint = process.env.OBJECT_STORAGE_ENDPOINT || "";
            const s3Ok =
              process.env.M15_OBJECT_STORAGE_INTEGRATION === "isolated" &&
              process.env.OBJECT_STORAGE_BACKEND === "s3" &&
              process.env.OBJECT_STORAGE_SERVER_SIDE_ENCRYPTION === "none" &&
              Boolean(endpoint) &&
              !endpoint.toLowerCase().includes("amazonaws.com");
            if (!dbOk || !s3Ok) {
              console.error("Integration test activation conditions are not met -- tests would silently skip.");
              console.error(`  TEST_DATABASE_URL set: ${dbOk}`);
              console.error(`  isolated S3 activation conditions met: ${s3Ok}`);
              process.exit(1);
            }
            console.log("Confirmed: PostgreSQL and isolated S3-compatible integration tests will execute, not skip.");
          '

      # Unit and integration tests share one command (already the existing CI
      # structure: tests/**/*.test.ts is included in the same vitest run as
      # src/**/*.test.ts). With the services and environment above in place,
      # the previously self-skipping PostgreSQL- and object-storage-gated
      # integration tests now execute for real as part of this same command.
      - run: npm run test

      - run: npm run build

      - name: Remove the temporary LocalStack container
        if: always()
        run: docker rm -f "$LOCALSTACK_CONTAINER_NAME" || true
